# ===============================
# Server
# ===============================
server.port=${PORT:8080}


# ===============================
# Datasource
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/RestServiceDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# ??? PostgreSQL ?????? ????? ?? ????????? dialect,
# Hibernate ??? ????????? ??? ?? ????????.
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}


# ===============================
# Multipart files
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}


# ===============================
# Static uploads / files
# ===============================
# ???? ? ???? ???? ???????? ???????? ????????? property, ????? ???????? ???:
app.upload.posts-dir=${POST_UPLOAD_DIR:uploads/posts}
app.upload.profiles-dir=${PROFILE_UPLOAD_DIR:uploads/profiles}


# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:TRACE}

# ?? Render ????? ????????? ????????? SQL:
# HIBERNATE_SQL_LOG_LEVEL=INFO
# HIBERNATE_BIND_LOG_LEVEL=INFO
# SPRING_JPA_SHOW_SQL=false
# SPRING_JPA_FORMAT_SQL=false


# ===============================
# Error handling
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always